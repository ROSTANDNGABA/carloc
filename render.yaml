services:
  - type: web
    name: carloc-api
    runtime: python
    rootDir: gestionlocationbackend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn gestionlocationbackend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        sync: false

      # Base de données
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432

      # Hôtes et CORS
      - key: ALLOWED_HOSTS
        value: carloc.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://carloc-smoky.vercel.app,https://carloc-git-main-rostandngabas-projects.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://carloc-smoky.vercel.app,https://carloc-git-main-rostandngabas-projects.vercel.app

      # Celery — exécution synchrone (pas de Redis sur Render free)
      - key: CELERY_TASK_ALWAYS_EAGER
        value: true

      # ----------------------------------------------------------------
      # EMAIL — Brevo (API HTTP, fonctionne sur Render free tier)
      # 1. Créer un compte gratuit sur brevo.com (300 emails/jour gratuits)
      # 2. Aller dans SMTP & API > API Keys > créer une clé
      # 3. Ajouter la clé dans BREVO_API_KEY sur le dashboard Render
      # ----------------------------------------------------------------
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_NAME
        value: CarLoc
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CARLOC_ADMIN_EMAIL
        sync: false

      # URL publique du backend (pour les liens dans les emails)
      - key: PUBLIC_BACKEND_URL
        value: https://carloc.onrender.com

      # Compte admin auto-créé au démarrage
      - key: CARLOC_ADMIN_USERNAME
        sync: false
      - key: CARLOC_ADMIN_PASSWORD
        sync: false

      # Stockage médias
      - key: CLOUDINARY_URL
        sync: false
