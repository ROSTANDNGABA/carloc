services:
  - type: web
    name: carloc-api
    runtime: python
    rootDir: gestionlocationbackend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn gestionlocationbackend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: ALLOWED_HOSTS
        value: carloc.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://carloc-smoky.vercel.app,https://carloc-git-main-rostandngabas-projects.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://carloc-smoky.vercel.app,https://carloc-git-main-rostandngabas-projects.vercel.app
      - key: CARLOC_ADMIN_EMAIL
        sync: false
      - key: CARLOC_ADMIN_USERNAME
        sync: false
      - key: CARLOC_ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
