services:
  - type: web
    name: carloc-api
    runtime: python
    rootDir: gestionlocationbackend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn gestionlocationbackend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: ALLOWED_HOSTS
        value: carloc.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://carloc-smoky.vercel.app,https://carloc-git-main-rostandngabas-projects.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://carloc-smoky.vercel.app,https://carloc-git-main-rostandngabas-projects.vercel.app
      - key: CELERY_TASK_ALWAYS_EAGER
        value: true
      - key: EMAIL_PROVIDER
        value: emailjs
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: true
      - key: EMAIL_USE_SSL
        value: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: CARLOC_ADMIN_EMAIL
        sync: false
      - key: CARLOC_ADMIN_USERNAME
        sync: false
      - key: CARLOC_ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
