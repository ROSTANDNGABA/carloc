name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestionlocationbackend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carloc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: carloc_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-secret-key
      DEBUG: 'True'
      CARLOC_DISABLE_LOGIN_THROTTLE: '1'
      CELERY_TASK_ALWAYS_EAGER: '1'
      CARLOC_FILE_ENCRYPTION_KEY: 1p4BFVkugW33nYov86Ej4qF3aPOWhaacQpzfEVFmujk=

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gestionlocationbackend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Django tests
        run: python manage.py test api.tests --verbosity=1

      - name: Pytest with coverage
        run: pytest --cov-fail-under=65 -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestionlocationfrontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gestionlocationfrontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --no-watch

      - name: Production build
        run: npx ng build --configuration=production
