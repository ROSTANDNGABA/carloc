# Configuration des pre-commit hooks pour CarLoc
# Installation: pip install pre-commit && pre-commit install

repos:
  # Hooks généraux
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  # Formatage Python - Black
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11
        args: ['--line-length=120']
        files: ^gestionlocationbackend/

  # Tri des imports - isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=120']
        files: ^gestionlocationbackend/

  # Linting Python - flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--extend-ignore=E203,W503']
        files: ^gestionlocationbackend/
        additional_dependencies: [flake8-bugbear, flake8-comprehensions]

  # Sécurité - Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-ll', '-x', 'test_*.py']
        files: ^gestionlocationbackend/api/

  # Django checks
  - repo: local
    hooks:
      - id: django-check
        name: Django Check
        entry: bash -c 'cd gestionlocationbackend && python manage.py check'
        language: system
        pass_filenames: false
        files: ^gestionlocationbackend/

  # Tests rapides (uniquement tests modifiés)
  - repo: local
    hooks:
      - id: pytest-quick
        name: Pytest Quick
        entry: bash -c 'cd gestionlocationbackend && pytest --exitfirst -x'
        language: system
        pass_filenames: false
        files: ^gestionlocationbackend/api/tests/
        always_run: false
